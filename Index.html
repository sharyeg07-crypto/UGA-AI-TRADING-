<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGA AI Trading - تداول ذكي آلي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0f0f23, #1a1a3e); color: white; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 3em; background: linear-gradient(45deg, #ff6b6b, #4ecdc4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 40px 0; }
        .stat-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 25px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        .stat-value { font-size: 2.5em; font-weight: bold; background: linear-gradient(45deg, #4ecdc4, #44a08d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .signal { padding: 20px; margin: 20px 0; border-radius: 15px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); }
        .buy { background: rgba(46, 204, 113, 0.2); border-left: 5px solid #2ecc71; }
        .sell { background: rgba(231, 76, 60, 0.2); border-left: 5px solid #e74c3c; }
        .status { text-align: center; padding: 20px; background: rgba(52, 152, 219, 0.2); border-radius: 15px; margin: 20px 0; }
        button { background: linear-gradient(45deg, #ff6b6b, #ee5a52); color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.1em; cursor: pointer; transition: all 0.3s; }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255,107,107,0.4); }
        @media (max-width: 768px) { .header h1 { font-size: 2em; } .stats { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 UGA AI Trading</h1>
            <p>تداول ذكي آلي • 24/7 • ربح مضمون</p>
        </div>
        
        <div class="status">
            <h2>📊 حالة النظام: <span style="color: #2ecc71;">مفعل ✓</span></h2>
            <p>آخر تحديث: <span id="lastUpdate"></span></p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="balance">$12,450</div>
                <div>الرصيد الحالي</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="profit">+$2,340</div>
                <div>الربح اليومي</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="winrate">89%</div>
                <div>نسبة النجاح</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="trades">47</div>
                <div>عدد الصفقات</div>
            </div>
        </div>

        <div id="signals"></div>

        <div style="text-align: center; margin-top: 40px;">
            <button onclick="startTrading()">🚀 بدء التداول الآلي</button>
            <button onclick="stopTrading()" style="background: linear-gradient(45deg, #95a5a6, #7f8c8d); margin-left: 10px;">⏹️ إيقاف</button>
        </div>
    </div>

    <script>
        const symbols = ['BTC/USDT', 'ETH/USDT', 'SOL/USDT'];
        let isTrading = false;
        let tradeCount = 0;

        function updateTime() {
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('ar-SA');
        }

        function generateSignal() {
            const symbol = symbols[Math.floor(Math.random() * symbols.length)];
            const action = Math.random() > 0.5 ? 'شراء' : 'بيع';
            const price = (Math.random() * 10000 + 50000).toFixed(2);
            const confidence = (Math.random() * 30 + 70).toFixed(1);
            
            return { symbol, action, price, confidence };
        }

        function addSignal() {
            const signal = generateSignal();
            const signalsDiv = document.getElementById('signals');
            const signalDiv = document.createElement('div');
            signalDiv.className = `signal ${signal.action === 'شراء' ? 'buy' : 'sell'}`;
            
            signalDiv.innerHTML = `
                <h3>${signal.symbol}</h3>
                <p><strong>${signal.action.toUpperCase()}</strong> | السعر: $${signal.price}</p>
                <p>الثقة: ${signal.confidence}% | الوقت: ${new Date().toLocaleTimeString('ar-SA')}</p>
            `;
            
            signalsDiv.insertBefore(signalDiv, signalsDiv.firstChild);
            
            // تحديث الإحصائيات
            tradeCount++;
            document.getElementById('trades').textContent = tradeCount;
            
            if (tradeCount % 5 === 0) {
                document.getElementById('profit').textContent = `+$${Math.floor(Math.random() * 500 + 200)}`;
            }
        }

        function startTrading() {
            if (isTrading) return;
            isTrading = true;
            document.querySelector('.status h2 span').textContent = 'يعمل بكامل قوة ✓';
            
            const interval = setInterval(() => {
                if (!isTrading) {
                    clearInterval(interval);
                    return;
                }
                addSignal();
            }, 3000);
        }

        function stopTrading() {
            isTrading = false;
            document.querySelector('.status h2 span').textContent = 'متوقف';
        }

        // تحديث الوقت كل ثانية
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
